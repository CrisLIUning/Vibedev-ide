<!-- VIBEDEV: brand mark (waveform) adapted from v1 vibedev-icon.svg.
     The dark gradient card is intentionally dropped: Zed renders this slot
     (VectorName::ZedLogo via gpui svg()) as a single-color theme-tinted mask,
     so the bars are kept on a transparent background and the two opacity tiers
     (0.95 / 0.45) survive as a two-tone waveform that adapts to light/dark. -->
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
<g transform="translate(60 60)" fill="#000000">
<rect x="-42" y="-10" width="6" height="10" rx="3" opacity="0.95"/>
<rect x="-32" y="-22" width="6" height="22" rx="3" opacity="0.95"/>
<rect x="-22" y="-14" width="6" height="14" rx="3" opacity="0.95"/>
<rect x="-12" y="-32" width="6" height="32" rx="3" opacity="0.95"/>
<rect x="-2" y="-18" width="6" height="18" rx="3" opacity="0.95"/>
<rect x="8" y="-28" width="6" height="28" rx="3" opacity="0.95"/>
<rect x="18" y="-12" width="6" height="12" rx="3" opacity="0.95"/>
<rect x="28" y="-24" width="6" height="24" rx="3" opacity="0.95"/>
<rect x="38" y="-16" width="6" height="16" rx="3" opacity="0.95"/>
<rect x="-42" y="0" width="6" height="7" rx="3" opacity="0.45"/>
<rect x="-32" y="0" width="6" height="15.4" rx="3" opacity="0.45"/>
<rect x="-22" y="0" width="6" height="9.8" rx="3" opacity="0.45"/>
<rect x="-12" y="0" width="6" height="22.4" rx="3" opacity="0.45"/>
<rect x="-2" y="0" width="6" height="12.6" rx="3" opacity="0.45"/>
<rect x="8" y="0" width="6" height="19.6" rx="3" opacity="0.45"/>
<rect x="18" y="0" width="6" height="8.4" rx="3" opacity="0.45"/>
<rect x="28" y="0" width="6" height="16.8" rx="3" opacity="0.45"/>
<rect x="38" y="0" width="6" height="11.2" rx="3" opacity="0.45"/>
</g>
</svg>
