# VIBEDEV P1 — build on GitHub-hosted FREE runners (public repo = unlimited free
# minutes for Linux/Windows/macOS standard runners), then deploy via
# script/release-deploy.sh behind the `production` environment's required reviewer.
#
# Standard runners are small (16GB RAM / ~14GB disk on Linux/Win, 7-14GB on mac).
# Unlike the Namespace CONTAINER runners, these are VMs (swap works) and Linux disk
# is reclaimable. Linux ships only the remote-server (light). Windows/macOS build
# the full IDE (heavy) and may exceed the free runners — if so, fall back to a
# bigger/self-hosted node (e.g. this 24GB Mac for macOS).
#
# HAND-WRITTEN (not generated). Draft — expect per-platform iteration.
name: VibeDev Release (IDE + remote-server)

on:
  workflow_dispatch:
    inputs:
      ide_version:
        description: "Version, e.g. 1.6.3 (manifest + archived download names)"
        required: true
        type: string
      platform:
        description: "Which platform to build + deploy"
        required: true
        type: choice
        default: linux-x86_64
        options:
          - linux-x86_64
          - windows-x86_64
          - macos-aarch64

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"   # cap parallel rustc → lower peak RAM on the 16GB runners

jobs:
  build-linux:
    if: ${{ inputs.platform == 'linux-x86_64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (standard runner only has ~14GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - run: echo stable > crates/zed/RELEASE_CHANNEL
      - run: ./script/linux
      - uses: dtolnay/rust-toolchain@stable
      # VibeDev ships no Linux DESKTOP IDE — build only the remote-server (light;
      # no webrtc-sys/clang needed, so this fits the small runner).
      - run: cargo build --release --target x86_64-unknown-linux-gnu -p remote_server
      - run: gzip -f -c target/x86_64-unknown-linux-gnu/release/remote_server > target/vibedev-remote-server-linux-x86_64.gz
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/vibedev-remote-server-linux-x86_64.gz dist/
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux-x86_64, path: dist/, if-no-files-found: error }

  build-windows:
    if: ${{ inputs.platform == 'windows-x86_64' }}
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # cargo fetches git deps (e.g. microsoft/python-environment-tools) whose
      # nested test fixtures blow past Windows' 260-char MAX_PATH under libgit2
      # ("path too long; class=Filesystem (30)"). Fetch with the git CLI, which
      # honors core.longpaths (enabled below) and uses the \\?\ long-path prefix.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - run: echo stable > crates/zed/RELEASE_CHANNEL
        shell: bash
      - name: Enable git long paths (Windows MAX_PATH)
        shell: bash
        run: git config --global core.longpaths true
      - uses: dtolnay/rust-toolchain@stable
      - run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      # TODO: confirm the installer artifact name bundle-windows.ps1 emits.
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "target/VibeDevSetup-${{ inputs.ide_version }}.exe" dist/ 2>/dev/null \
            || cp target/Zed-x86_64.exe "dist/VibeDevSetup-${{ inputs.ide_version }}.exe"
          cp target/vibedev-remote-server-windows-x86_64.zip dist/
      - uses: actions/upload-artifact@v4
        with: { name: dist-windows-x86_64, path: dist/, if-no-files-found: error }

  build-macos:
    if: ${{ inputs.platform == 'macos-aarch64' }}
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: echo stable > crates/zed/RELEASE_CHANNEL
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@stable
      # NOTE: the full IDE build needs ~24GB; a free GitHub mac runner (7-14GB) may
      # OOM/run out of disk. If so, build macOS on the 24GB dev Mac instead.
      - run: ./script/bundle-mac aarch64-apple-darwin
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/VibeDev-aarch64.dmg dist/
          cp target/vibedev-remote-server-macos-aarch64.gz dist/
      - uses: actions/upload-artifact@v4
        with: { name: dist-macos-aarch64, path: dist/, if-no-files-found: error }

  deploy:
    needs: [build-linux, build-windows, build-macos]
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: production           # required-reviewer gate before any deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: "dist-*" }
      - name: Install deploy SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Deploy + verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: /home/runner/.ssh/deploy_key
          DOWNLOADS_DIR: ${{ secrets.DOWNLOADS_DIR }}
          MANIFEST_PATH: ${{ secrets.MANIFEST_PATH }}
          PUBLIC_PREFIX: ${{ secrets.PUBLIC_PREFIX }}
          OTA_BASE: ${{ secrets.OTA_BASE }}
        run: |
          plat="${{ inputs.platform }}"
          dir="artifacts/dist-$plat"
          [ -d "$dir" ] || { echo "no artifacts for $plat (build skipped/failed)"; exit 1; }
          chmod +x script/release-deploy.sh script/update-ota-manifest.py
          ./script/release-deploy.sh --ide-version "${{ inputs.ide_version }}" --artifacts "$dir" --platform "$plat"
