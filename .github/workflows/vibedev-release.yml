# VIBEDEV P1 — build the IDE + remote-server on Namespace runners, then deploy to
# the OTA download station via script/release-deploy.sh (gated by the `production`
# environment's required reviewer).
#
# HAND-WRITTEN (do NOT regenerate): the upstream run_bundling.yml / release.yml are
# generated by `cargo xtask workflows` and target zed-industries — not used here.
#
# STATUS: draft v1 — expect 1-2 test-run iterations to settle the build environment
# on raw Namespace runners (Rust toolchain / platform deps / macOS Metal toolchain
# are baked into Zed's custom profiles but NOT into raw nscloud images).
#
# PREREQUISITES (see CICD-RELEASE-PLAN.md):
#   - PR #1 (macOS support: bundle-mac rename/branding, build fixes) merged to the
#     branch this runs on — otherwise bundle-mac emits Zed-*.dmg, not VibeDev-*.dmg.
#   - PR #2 (script/release-deploy.sh + update-ota-manifest.py) merged similarly.
#   - `production` environment + these secrets: DEPLOY_SSH_KEY, DEPLOY_HOST,
#     DOWNLOADS_DIR, MANIFEST_PATH, PUBLIC_PREFIX, OTA_BASE.
name: VibeDev Release (IDE + remote-server)

on:
  workflow_dispatch:
    inputs:
      ide_version:
        description: "Version, e.g. 1.6.3 (used for manifest + archived download names)"
        required: true
        type: string
      platform:
        description: "Which platform to build + deploy"
        required: true
        type: choice
        default: macos-aarch64
        options:
          - macos-aarch64
          - linux-x86_64
          - windows-x86_64

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build-macos:
    if: ${{ inputs.platform == 'macos-aarch64' }}
    runs-on: nscloud-macos-sonoma-arm64-6x14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: echo stable > crates/zed/RELEASE_CHANNEL   # release builds MUST be stable
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@stable             # raw runner: install Rust
      # ASSUMES: bundle-mac ad-hoc signs when no MACOS_CERTIFICATE is set, and that
      # the Namespace macOS image has the Metal toolchain (TO VERIFY on first run).
      - run: ./script/bundle-mac aarch64-apple-darwin
      - name: Stage artifacts for release-deploy
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/VibeDev-aarch64.dmg dist/
          cp target/vibedev-remote-server-macos-aarch64.gz dist/
      - uses: actions/upload-artifact@v4
        with: { name: dist-macos-aarch64, path: dist/, if-no-files-found: error }

  build-linux:
    if: ${{ inputs.platform == 'linux-x86_64' }}
    runs-on: nscloud-ubuntu-20.04-amd64-8x16
    env:
      # webrtc-sys's C++ needs clang 17+ (C++20); script/linux installs clang-18
      # on 20.04 (NOT on 22.04, where default g++/clang-14 fail). Mirrors the
      # proven run_bundling.yml (20.04 + clang-18).
      CC: clang-18
      CXX: clang++-18
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: echo stable > crates/zed/RELEASE_CHANNEL
      - run: ./script/linux                 # Zed's Ubuntu dependency installer
      - run: ./script/download-wasi-sdk
      - uses: dtolnay/rust-toolchain@stable
      - run: ./script/bundle-linux
      # VibeDev ships no Linux desktop IDE — only the remote-server is deployed.
      - name: Stage artifacts for release-deploy
        run: |
          mkdir -p dist
          cp target/vibedev-remote-server-linux-x86_64.gz dist/
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux-x86_64, path: dist/, if-no-files-found: error }

  build-windows:
    if: ${{ inputs.platform == 'windows-x86_64' }}
    runs-on: nscloud-windows-2022-amd64-8x16
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: echo stable > crates/zed/RELEASE_CHANNEL
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
      - run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      # TODO(P1): confirm the installer artifact name bundle-windows.ps1 emits and
      # rename it to VibeDevSetup-${{ inputs.ide_version }}.exe here.
      - name: Stage artifacts for release-deploy
        shell: bash
        run: |
          mkdir -p dist
          cp "target/VibeDevSetup-${{ inputs.ide_version }}.exe" dist/ 2>/dev/null \
            || cp target/Zed-x86_64.exe "dist/VibeDevSetup-${{ inputs.ide_version }}.exe"
          cp target/vibedev-remote-server-windows-x86_64.zip dist/
      - uses: actions/upload-artifact@v4
        with: { name: dist-windows-x86_64, path: dist/, if-no-files-found: error }

  deploy:
    needs: [build-macos, build-linux, build-windows]
    if: ${{ always() && !cancelled() && !failure() }}
    runs-on: nscloud-ubuntu-22.04-amd64-4x8
    environment: production           # ← required-reviewer gate before any deploy
    steps:
      - uses: actions/checkout@v4     # need script/release-deploy.sh + update-ota-manifest.py
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: "dist-*", merge-multiple: false }
      - name: Install deploy SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: /home/runner/.ssh/deploy_key
          DOWNLOADS_DIR: ${{ secrets.DOWNLOADS_DIR }}
          MANIFEST_PATH: ${{ secrets.MANIFEST_PATH }}
          PUBLIC_PREFIX: ${{ secrets.PUBLIC_PREFIX }}
          OTA_BASE: ${{ secrets.OTA_BASE }}
        run: |
          plat="${{ inputs.platform }}"
          dir="artifacts/dist-$plat"
          [ -d "$dir" ] || { echo "no artifacts for $plat (build skipped/failed)"; exit 1; }
          chmod +x script/release-deploy.sh script/update-ota-manifest.py
          ./script/release-deploy.sh --ide-version "${{ inputs.ide_version }}" --artifacts "$dir" --platform "$plat"
