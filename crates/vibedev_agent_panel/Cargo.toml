[package]
name = "vibedev_agent_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/vibedev_agent_panel.rs"
doctest = false

[dependencies]
agent.workspace = true
agent-client-protocol.workspace = true
agent_ui.workspace = true
anyhow.workspace = true
collections.workspace = true
fs.workspace = true
gpui.workspace = true
project.workspace = true
ui.workspace = true
workspace.workspace = true
zed_actions.workspace = true

[dev-dependencies]
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
# Keeps `remote_connection/test-support` unified with the `remote/test-support`
# pulled in transitively via the `agent`/`agent_ui` deps; without it the
# `RemoteConnectionOptions::Mock` match arm is cfg'd out while the variant is
# present, breaking the test build (same workaround as agent_ui/git_ui/etc.).
remote_connection = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
theme = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
workspace = { workspace = true, features = ["test-support"] }
